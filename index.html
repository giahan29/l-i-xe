<html lang="vi">

    <title>Neon Traffic Dodge - Cyberpunk Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;

        }

            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: #0a0b12;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 9, 15, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }

            display: none !important;
        }
